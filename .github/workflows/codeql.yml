name: CodeQL

# Static security analysis of the TypeScript and JavaScript code and of the workflows.
# Results go to the Security tab (Code scanning).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read # read the workflow run for the results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # No build step: CodeQL reads the TypeScript source directly.
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - 'contracts/lib/**'
              - 'docs/.vitepress/cache/**'
              - 'docs/.vitepress/dist/**'
              - 'launch/**'
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
