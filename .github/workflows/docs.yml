name: Docs

# Deploys the docs and the playground (mock providers, no secrets) to GitHub Pages.
# One-time setup: Settings > Pages > Source = GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs and playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # https://yosriady.github.io/openrampkit/. Remove this for a custom domain.
      DOCS_BASE: /openrampkit/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated in the docs reads the git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build packages, docs and playground
        run: pnpm site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
