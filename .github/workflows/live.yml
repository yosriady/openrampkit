name: Live checks

# Checks the provider adapters against the live provider APIs, once a night.
# Unit tests use fakeFetch, so they do not see a change in a provider API. These checks do.
# They move no money. They need the RELAY_API_KEY repository secret.
# Without the secret, the check skips and writes the reason to the job summary.
# On a failure, the report job opens one issue, or adds a comment to the open one.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC each night
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  relay:
    name: Relay live check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the packages and run the Relay live check (moves no money)
        # The key is only in this step. The script never prints it, and GitHub masks secrets in the log.
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
        run: pnpm live:relay

  report:
    name: Report a failure
    needs: [relay]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open the failure issue or comment on it
    steps:
      - name: Open or update the live check issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Live check failed: provider API'
          body="The nightly live check failed. Read the log: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Added a comment to issue #${number}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$title" --body "$body"
            echo "Opened a new issue: ${title}." >> "$GITHUB_STEP_SUMMARY"
          fi
