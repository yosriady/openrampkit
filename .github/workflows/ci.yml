name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Unit and integration tests with coverage
        run: pnpm coverage
      - name: Typecheck examples
        run: |
          pnpm --filter next-demo exec tsc --noEmit -p .
          pnpm --filter cloudflare-worker-example exec tsc --noEmit -p .
          pnpm --filter playground typecheck
      - name: Package smoke test (pack, install, ESM, CJS, SSR, TypeScript)
        run: pnpm smoke
      - name: Docs build
        run: pnpm docs:build

  chain:
    name: Local chain test (Anvil, real WALLET_TX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - run: pnpm install --frozen-lockfile
      - name: Anvil end-to-end test (server, client, wagmi adapter, mock USDC)
        env:
          OPENRAMP_REQUIRE_ANVIL: '1'
        run: pnpm test:chain

  contracts:
    name: Contracts (Foundry) and settlement helpers on Anvil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned so `forge fmt --check` does not change with new releases
          version: v1.8.3
      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript helpers against the compiled contract (ABI check, Anvil deploy, EIP-712 parity)
        env:
          OPENRAMP_REQUIRE_SETTLEMENT_CHAIN: '1'
        run: pnpm exec vitest run packages/adapter/src/settlement
      # Last step: Slither runs `forge clean` before its own build.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Slither (fails on high or medium findings, see contracts/audit/static-analysis.md)
        working-directory: contracts
        run: |
          pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.28
          solc-select use 0.8.28
          slither .

  e2e:
    name: Browser tests (desktop, Android, iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter next-demo exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        working-directory: examples/next-demo
        env:
          CI: '1'
          OPENRAMP_MOCK: '1'
          OPENRAMP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          PUBLIC_URL: http://localhost:3000
        run: pnpm exec playwright test e2e/deposit.spec.ts e2e/withdraw.spec.ts e2e/a11y.spec.ts e2e/keyboard.spec.ts e2e/locales.spec.ts
      - name: Run playground browser tests (static build, desktop and Pixel 7)
        if: success() || failure()
        working-directory: examples/playground
        env:
          CI: '1'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/next-demo/playwright-report
            examples/playground/playwright-report
          retention-days: 7
