name = "openramp-server"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Sessions live in a Durable Object: strongly consistent and built into Workers (no extra service).
[[durable_objects.bindings]]
name = "OPENRAMP_STORE"
class_name = "OpenRampStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenRampStore"]

[triggers]
crons = ["* * * * *"]

[vars]
PUBLIC_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:3000"
# Secrets (set with `wrangler secret put`): OPENRAMP_SECRET, APP_API_KEY, WEBHOOK_URL, WEBHOOK_SECRET
